name: MORPHE-AUTO
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/MAuto.yml'
      - '.github/MYT.sh'
  schedule:
    - cron: '0 0 * * 6'

permissions: write-all

jobs:
  build:
    name: Build ${{ matrix.device }} ${{ matrix.type == 'true' && 'root' || 'no-root' }}
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    
    env:
      GH_TOKEN: ${{ github.token }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 'arm64-v8a'
            type: 'true'
          - device: 'arm64-v8a'
            type: 'false'
          - device: 'armeabi-v7a'
            type: 'true'
          - device: 'armeabi-v7a'
            type: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: See build
        run: |
          # chamchamfy
          if [ -z "$VERSION" ]; then
            DEVICE='${{ matrix.device }}'
            DEV='Stable'
            VERSION='Auto'
            TYPE='${{ matrix.type }}'
          fi
          . .github/install.sh
          . .github/MYT.sh

      - name: Upload File
        run: |
          TAG="M${{ env.V }}${{ env.VER }}"
          gh release create "$TAG" --title "YT-MORPHE ${{ env.VER }} ${{ env.Kad }}" --notes "${{ env.BODY }}" || true
          gh release upload "$TAG" Up/* --clobber

      - name: Upload Json
        if: matrix.type == 'true'
        run: |
          gh release create "Up" --title "Update" --notes "" --prerelease || true
          gh release upload "Up" Up*.json --clobber
