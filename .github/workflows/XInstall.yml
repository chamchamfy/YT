name: YT-EXT
on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Example: 19.47.53'
        required: false
        default: 'New'
      DEVICE:
        description: 'Select device'
        required: false
        default: 'armeabi-v7a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      DEV:
        description: 'Tool cli'
        required: false
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Develop
      FEATURE:
        description: 'Turn off feature'
        required: false
        default: ' -d "Custom branding YouTube name" -d "Custom branding icon Revancify red" -d "Custom branding icon MMT" -d "Custom branding icon Revancify blue" -d "Custom branding icon Revancify Blue" -d "Custom branding name YouTube" -d "Custom branding icon YouTube" -d "Custom branding name for YouTube" -d "Custom branding icon for YouTube" '
permissions: write-all
jobs:
  build1:
    name: 'Buid root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
  build2:
    name: 'Buid no-root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
  build3:
    name: 'Buid amoled root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
  build4:
    name: 'Buid amoled no-root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
