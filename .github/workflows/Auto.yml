name: RE-AUTO
on:
  workflow_dispatch:
  push:
   paths:
      - '.github/workflows/Auto.yml'
      - '.github/YT.sh'
  schedule:
     - cron: '0 0 * * 6'
permissions: write-all
env:
    GH_TOKEN: ${{ github.token }}
jobs:
  build1:
    name: 'Build armeabi-v7a root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        run: |
          # kakathic
          if [ -z "$VERSION" ];then
          DEVICE='armeabi-v7a'
          DEV='Stable'
          VERSION='Auto'
          TYPE='true'
          fi
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-RE ${{ env.VER }} ${{ env.Kad }}
          tag_name: K${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
  build2:
    name: 'Build armeabi-v7a no-root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        run: |
          # kakathic
          if [ -z "$VERSION" ];then
          DEVICE='armeabi-v7a'
          DEV='Stable'
          VERSION='Auto'
          TYPE='false'
          fi
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-RE ${{ env.VER }} ${{ env.Kad }}
          tag_name: K${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
  build3:
    name: 'Build armeabi-v7a amoled root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        run: |
          # kakathic
          if [ -z "$VERSION" ];then
          DEVICE='armeabi-v7a'
          DEV='Stable'
          VERSION='Auto'
          TYPE='true'
          AMOLED='true'
          fi
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-RE ${{ env.VER }} ${{ env.Kad }}
          tag_name: K${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
  build4:
    name: 'Build armeabi-v7a amoled no-root'
    if: github.repository == 'chamchamfy/YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        run: |
          # kakathic
          if [ -z "$VERSION" ];then
          DEVICE='armeabi-v7a'
          DEV='Stable'
          VERSION='Auto'
          TYPE='false'
          AMOLED='true'
          fi
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-RE ${{ env.VER }} ${{ env.Kad }}
          tag_name: K${{ env.V }}${{ env.VER }}
          files: Up/*
          body: "${{ env.BODY }}"
